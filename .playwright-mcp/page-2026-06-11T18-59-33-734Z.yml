                      - text: + one orientation page per segment) tracks each segment's audit status and dependency graph, so a session can orient in seconds without re-reading the whole tree.
                - paragraph [ref=e532]:
                  - text: "Changes flow one way: a bug fix or feature starts by finding where"
                  - emphasis [ref=e533]: intent
                  - text: diverged, not by patching code. The payoff is that the docs are never archaeology — they are the contract the tests enforce.
                - paragraph [ref=e534]:
                  - strong [ref=e535]: "A guided tour, five files in order:"
