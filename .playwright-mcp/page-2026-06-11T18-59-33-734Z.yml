              - article [ref=e447]:
                - generic [ref=e448]:
                  - heading "portfolio-tracker" [level=1] [ref=e449]
                  - 'link "Permalink: portfolio-tracker" [ref=e450] [cursor=pointer]':
                    - /url: "#portfolio-tracker"
                    - img [ref=e451]
                - paragraph [ref=e453]:
                  - text: A personal stock-portfolio and tax tracker for a single owner-operator — and a working, end-to-end demonstration of
                  - strong [ref=e454]: Linked-Intent Development (LID)
                  - text: ", a methodology where every line of code traces back through tests and structured requirements to a design document."
                - generic [ref=e455]:
                  - heading "What this is" [level=2] [ref=e456]
                  - 'link "Permalink: What this is" [ref=e457] [cursor=pointer]':
                    - /url: "#what-this-is"
                    - img [ref=e458]
                - paragraph [ref=e460]: It tracks equity and RSU positions held across multiple trading platforms, computes realized and unrealized profit on a tax-lot basis, calculates per-sale federal + state tax from configured income and bracket tables, and manages each sale's tax accrual through a real lifecycle (accrued → allocated → moved → paid). It replaces a hand-wired Google Sheet and the shell script that scraped it.
                - paragraph [ref=e461]: "The architecture in one breath:"
                - list [ref=e462]:
                  - listitem [ref=e463]:
                    - strong [ref=e464]: Google Sheets is the canonical store.
                    - text: Activity lives in append-only event-log tabs (rows are never edited — corrections are new compensating events). The app also publishes clean, filterable read-only view tabs with a
                    - code [ref=e465]: GOOGLEFINANCE
                    - text: column as the live-price oracle. A local SQLite cache mirrors the log for fast/offline reads and carries no truth.
                  - listitem [ref=e466]:
                    - strong [ref=e467]: A ratatui terminal UI
                    - text: "is the entry surface: buy/vest/sell, accrual actions, residency and config changes, plus five report screens."
                  - listitem [ref=e468]:
                    - strong [ref=e469]:
                      - text: A headless
                      - code [ref=e470]: pt summary
                      - text: command
                    - text: prints the daily portfolio summary with day-over-day deltas (text or JSON), for cron and scripts.
                  - listitem [ref=e471]:
                    - strong [ref=e472]: Tax is calculated, not typed
                    - text: ": long-term vs short-term by holding period, per-year federal and state bracket tables, the state stamped on each transaction so interstate moves are exact."
                  - listitem [ref=e473]:
                    - strong [ref=e474]: The money math is formally verified.
                    - text: The pure accounting/tax kernels live in
                    - code [ref=e475]: "verus!{}"
                    - text: modules proven with
                    - link "Verus" [ref=e476] [cursor=pointer]:
                      - /url: https://github.com/verus-lang/verus
                    - text: (share/cost conservation, FIFO realized-P&L, rounding and tax-calculation bounds, accrual-lifecycle invariants) with
                    - link "Kani" [ref=e477] [cursor=pointer]:
                      - /url: https://github.com/model-checking/kani
                    - text: "bounded model checks on the integer arithmetic kernel. Honestly: only the pure kernels are verified — serialization, the Sheets I/O, and the TUI are ordinary tested Rust outside the proof, crossing into the kernels through a single drift-guard-tested trust seam."
                - paragraph [ref=e478]: "The TUI's Positions screen, in its gilt \"Ledger\" visual language:"
                - generic [ref=e479]:
                  - code [ref=e481]: L E D G E R as-of 2026-06-09 ╭─ Positions ──────────────────────────────────────────────────────────────────────╮ │ TOTAL VALUE $1,284,300 ▲ +$8,420 (+0.66%) │ │ NET (POST-TAX) $902,160 [est] │ │ REALIZED 2026 YTD ▲ +$48,210 │ │ ════════════════════════════════════════════════════════════════════════════ │ │ SYMBOL NAME SHARES │ PRICE │ VALUE │ UNREAL │ NET │ │ │ ▎ AMZN Amazon.com 620 │ $261.26 │ $162.0k │ +$131.0k │ $126,545 [est] │ ▁▂▃▅▆▇······ │ GOOGL Alphabet 60 │ $376.37 │ $22.6k │ −$410 │ $21,940 [est] │ ▇▆▅▃▂▁······ │ PLTR Palantir — │ unpriced│ — │ ‡ │ — │ ············ ╰──────────────────────────────────────────────────────────────────────────────────╯ TAX 2026 RSU-GRNT1-a AMZN $2,400 ◉◉◉○ Moved GOOGL $253 ◉◉◉◉ Paid ● connected · sync as-of 2026-06-09 · updated 16:02 · 🔓 · Positions [tab] entry [1-5] screens [r] refresh [?] help [q] quit
                  - button "Copy code to clipboard" [ref=e483] [cursor=pointer]:
                    - img [ref=e484]
                - generic [ref=e487]:
                  - heading "Why this repo is interesting — LID in practice" [level=2] [ref=e488]
                  - 'link "Permalink: Why this repo is interesting — LID in practice" [ref=e489] [cursor=pointer]':
                    - /url: "#why-this-repo-is-interesting--lid-in-practice"
                    - img [ref=e490]
                - paragraph [ref=e492]:
                  - text: LID's core idea is a one-directional
                  - strong [ref=e493]: arrow of intent
                  - text: ":"
                - generic [ref=e494]:
                  - code [ref=e496]: HLD → LLDs → EARS → Tests → Code
                  - button "Copy code to clipboard" [ref=e498] [cursor=pointer]:
                    - img [ref=e499]
                - list [ref=e502]:
                  - listitem [ref=e503]:
                    - paragraph [ref=e504]:
                      - text: The
                      - strong [ref=e505]: HLD
                      - text: (high-level design,
                      - code [ref=e506]: docs/high-level-design.md
                      - text: ) states the problem, the approach, goals/non-goals, and ordered tenets.
                  - listitem [ref=e507]:
                    - paragraph [ref=e508]:
                      - text: Each component gets an
                      - strong [ref=e509]: LLD
                      - text: (low-level design) under
                      - code [ref=e510]: docs/intent/
                      - text: — eleven segments, from the verified
                      - code [ref=e511]: ledger-core
                      - text: kernel to the one-time legacy
                      - code [ref=e512]: import
                      - text: er.
                  - listitem [ref=e513]:
                    - paragraph [ref=e514]:
                      - text: Each LLD's behavior is pinned as
                      - strong [ref=e515]: EARS
                      - text: specs — one-line structured requirements, numbered and checkbox-tracked, beside the design doc. A real one, from
                      - code [ref=e516]: docs/intent/store/store-specs.md
                      - text: ":"
                    - blockquote [ref=e517]:
                      - paragraph [ref=e518]:
                        - strong [ref=e519]: STORE-WRITE-004
                        - text: ": After appending, the system shall read the row back by"
                        - code [ref=e520]: EventId
                        - text: and assert structural equality with the event written before confirming the write; a field mismatch shall raise
                        - code [ref=e521]: WriteVerifyMismatch
                        - text: .
                  - listitem [ref=e522]:
                    - paragraph [ref=e523]:
                      - strong [ref=e524]: Tests cite specs
                      - text: with
                      - code [ref=e525]: // @spec STORE-WRITE-004
                      - text: comments, and code annotates the entry point of each behavior the same way. The coverage gate in
                      - code [ref=e526]: scripts/ci.sh
                      - text: "makes the binding mechanical: every one of the"
                      - strong [ref=e527]: 350 defined specs
                      - text: must be cited by at least one test, and every citation must resolve to a defined spec — 350/350, in both directions, or CI fails. Renaming a spec without updating its tests breaks the build.
                  - listitem [ref=e528]:
                    - paragraph [ref=e529]:
                      - text: A navigation overlay in
