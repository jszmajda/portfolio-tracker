name: ci

on:
  push:
  pull_request:

# The single canonical gate is scripts/ci.sh — IDENTICAL local and CI. This
# workflow is the thin CI host around it.
#
# STAGES (all driven by scripts/ci.sh):
#   * fmt                 — GATING. The workspace is rustfmt-formatted; rustfmt
#                           leaves the verus!{} macro bodies untouched (it cannot
#                           parse Verus syntax), so the verified cores are
#                           unaffected by formatting.
#   * clippy              — advisory.
#   * build + test        — GATING, offline + deterministic; always runs (no secrets
#                           / network needed — the verified kernels are pure).
#   * Verus + Kani        — per verified crate (ledger-core, tax), GATING: the two
#                           provisioning steps below install the pinned Verus
#                           release (0.2026.05.13.fae8859, matching the
#                           vstd =0.0.0-2026-05-10-0145 crates.io pin) and Kani
#                           0.67.0, and the gate runs with PT_CI_REQUIRE_VERUS=1 /
#                           PT_CI_REQUIRE_KANI=1 so an absent toolchain is a hard
#                           failure, never a silent SKIP.
#   * @spec-coverage      — GATING: every behavioral EARS spec is cited by a test.
#   * real-Sheets e2e     — GATING when enabled, SKIP otherwise. It authenticates +
#                           hits Google Sheets, so it runs ONLY when the
#                           GOOGLE_SHEETS_SA secret is configured AND PT_E2E=1; the
#                           creds secret is materialized to a file and pointed at by
#                           GOOGLE_APPLICATION_CREDENTIALS (see the e2e step). It is
#                           idempotent + self-cleaning (dedicated pt_e2e_ tabs), so
#                           a re-run is always safe.
#
# CI PROVISIONS (below): the Verus toolchain (tools/verus-arm64-macos, from the
# pinned GitHub release) and Kani (cargo install + cargo kani setup), both cached.
# STILL OPTIONAL: the GOOGLE_SHEETS_SA repository secret (the service-account
# JSON) + the PT_WORKBOOK_ID repository secret (the dedicated test workbook's
# id) — to run the real-Sheets e2e.

jobs:
  gate:
    # macOS arm64: the project targets a Mac Mini host and the Verus toolchain is
    # arm64-macos (tools/verus-arm64-macos). The offline gate (fmt/build/test/
    # @spec-coverage) is platform-agnostic; Verus/Kani are provisioned below and
    # required (PT_CI_REQUIRE_VERUS/KANI=1).
    runs-on: macos-14
    # Secrets are lifted to job env because the `secrets` context is not
    # permitted in step-level `if:` expressions (the workflow file fails
    # validation outright). Empty when unconfigured — the e2e step then skips.
    env:
      GOOGLE_SHEETS_SA: ${{ secrets.GOOGLE_SHEETS_SA }}
      PT_WORKBOOK_ID: ${{ secrets.PT_WORKBOOK_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustup show && rustc --version && cargo --version

      - name: Install gtimeout (coreutils — the verification timeout guard)
        run: brew install coreutils

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # --- Provision the Verus toolchain (GATING; pinned release). ---
      # The toolchain dir (tools/verus-arm64-macos) is .gitignored by size, so it
      # is restored from the cache or fetched from the pinned verus-lang/verus
      # release. The release pin matches the vstd =0.0.0-2026-05-10-0145 pin in
      # the verified crates' Cargo.toml; bump them together. Verus runs against
      # the Rust toolchain it was built with (1.95.0), installed via rustup.
      - name: Cache Verus toolchain
        uses: actions/cache@v4
        with:
          path: tools/verus-arm64-macos
          key: verus-0.2026.05.13.fae8859-arm64-macos

      - name: Provision Verus toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if [ ! -x tools/verus-arm64-macos/cargo-verus ]; then
            mkdir -p tools
            curl -fsSL -o "$RUNNER_TEMP/verus.zip" \
              "https://github.com/verus-lang/verus/releases/download/release%2F0.2026.05.13.fae8859/verus-0.2026.05.13.fae8859-arm64-macos.zip"
            unzip -q "$RUNNER_TEMP/verus.zip" -d "$RUNNER_TEMP/verus-unpack"
            mv "$RUNNER_TEMP/verus-unpack/verus-arm64-macos" tools/verus-arm64-macos
          fi
          tools/verus-arm64-macos/verus --version

      # --- Provision Kani (GATING; pinned version). ---
      - name: Cache Kani
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: kani-0.67.0-${{ runner.os }}

      - name: Provision Kani
        run: |
          command -v cargo-kani >/dev/null || cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
          cargo kani --version

      # --- OPTIONAL: materialize the Google service-account creds for the e2e. ---
      # Configure the GOOGLE_SHEETS_SA repository secret (the service-account
      # JSON) and the PT_WORKBOOK_ID repository secret (the dedicated test
      # workbook's id). When both are present, this writes the creds to a file
      # the e2e points at; when absent, the e2e SKIPs (the env vars below stay
      # empty).
      - name: Materialize Google creds (if the secrets are configured)
        if: ${{ env.GOOGLE_SHEETS_SA != '' && env.PT_WORKBOOK_ID != '' }}
        run: |
          # via env, never inline interpolation: the SA JSON must land byte-exact.
          printf '%s' "$GOOGLE_SHEETS_SA" > "$RUNNER_TEMP/gsheets-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gsheets-sa.json" >> "$GITHUB_ENV"
          echo "PT_E2E=1" >> "$GITHUB_ENV"

      # The single canonical gate. fmt/build/test/@spec-coverage always;
      # Verus/Kani REQUIRED (provisioned above — absence is a failure, not a
      # SKIP); e2e if PT_E2E=1 + creds are set.
      - name: CI gate (scripts/ci.sh)
        env:
          PT_CI_REQUIRE_VERUS: "1"
          PT_CI_REQUIRE_KANI: "1"
        run: bash scripts/ci.sh
